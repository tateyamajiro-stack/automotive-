[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hils-manager"
version = "0.1.0"
description = "HILS自動テスト開発管理アプリケーション"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6,<7.0",
    "requests>=2.31,<3.0",
    "Jinja2>=3.1,<4.0",
    "PyYAML>=6.0,<7.0",
    "python-dateutil>=2.9,<3.0",
    "cryptography>=41.0,<43.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-qt>=4.2",
    "pytest-cov>=4.0",
    "mypy>=1.5",
    "black>=23.0",
    "flake8>=6.0",
    "PyInstaller>=6.0,<7.0",
]

[project.scripts]
hils-manager = "hils_manager.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
